[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repertoire-app"
version = "0.1.0"
description = "Lichess game import and master-game repertoire statistics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-chess>=1.999"]

[project.scripts]
repertoire-import = "repertoire_app.cli:main"
repertoire-tree = "repertoire_app.repertoire.cli:main"
repertoire-web = "repertoire_app.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repertoire_app.web" = ["static/*.html"]
repertoire_app = ["openings/*.tsv", "openings/COPYING.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
